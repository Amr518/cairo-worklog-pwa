name: Daily Spare Parts Sync (Email -> PWA)

on:
  schedule:
    # Runs daily at 07:30 UTC (09:30 Cairo) and 09:30 UTC (11:30 Cairo)
    - cron: "30 7 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-spare-parts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest super pates CSV from email & update spare_parts_data.json
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          EMAIL_SUBJECTS: "super pates,spare parts,spars parts"
        run: |
          if [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_APP_PASSWORD" ]; then
            echo "::warning::EMAIL_USER or EMAIL_APP_PASSWORD repository secret is not configured yet. Skipping sync."
            exit 0
          fi
          python3 scripts/sync_spares_from_email.py spare_parts_data.json

      - name: Commit & push updated spare_parts_data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet spare_parts_data.json; then
            echo "No inventory changes detected today."
            exit 0
          fi
          DATE_TAG=$(date -u +"%Y-%m-%d")
          git add spare_parts_data.json
          git commit -m "chore(spares): automatic daily JDE inventory sync (${DATE_TAG})"
          git push origin main
