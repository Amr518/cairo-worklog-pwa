<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>بوابة صيانة سيرفييه الموحدة | Servier Unified Maintenance Portal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="صيانة سيرفييه">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c1a4e">
  <style>
    :root {
      --header-h: 46px;
      --bg-header: #1c1a4e;
      --bg-header-border: #2d2a73;
      --navy: #242269;
      --coral: #f55b41;
      --coral-hover: #fa725b;
      --text-dim: #9da3c6;
      --text-bright: #ffffff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Segoe UI Arabic", sans-serif;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    /* Header & Switcher */
    .portal-header {
      height: var(--header-h);
      min-height: var(--header-h);
      background: var(--bg-header);
      border-bottom: 1px solid var(--bg-header-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }
    .brand-section img {
      height: 24px;
      width: auto;
      display: block;
    }
    .brand-badge {
      background: rgba(245, 91, 65, 0.2);
      color: var(--coral);
      border: 1px solid rgba(245, 91, 65, 0.4);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 600;
    }
    .app-switcher {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
    }
    .switch-btn {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .switch-btn:hover {
      color: #fff;
    }
    .switch-btn.active {
      background: var(--coral);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(245, 91, 65, 0.45);
    }
    .status-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .online-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .online-indicator.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }
    /* Viewports */
    .viewport-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100% - var(--header-h));
      overflow: hidden;
      background: #0f172a;
    }
    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }
    .app-frame.active {
      display: block;
    }
    @media (max-width: 640px) {
      .brand-title {
        display: none;
      }
      .brand-badge {
        display: none;
      }
      .portal-header {
        padding: 0 6px;
        justify-content: center;
      }
      .switch-btn {
        font-size: 11.5px;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body>
<div id="app-container">
  <header class="portal-header">
    <div class="brand-section">
      <img src="logo-white.png" alt="Servier Logo" onerror="this.style.display='none'">
      <span class="brand-title">صيانة سيرفييه</span>
      <span class="brand-badge">موحد</span>
    </div>

    <!-- App Switcher Nav -->
    <nav class="app-switcher" role="tablist" aria-label="تبديل التطبيقات">
      <button
        id="tab-worklog"
        class="switch-btn active"
        role="tab"
        aria-selected="true"
        aria-controls="frame-worklog"
        onclick="switchApp('worklog')"
      >
        <span>📋 شغلي | Work Log (Servier)</span>
      </button>
      <button
        id="tab-maintenance"
        class="switch-btn"
        role="tab"
        aria-selected="false"
        aria-controls="frame-maintenance"
        onclick="switchApp('maintenance')"
      >
        <span>⚙️ تشخيص الكتالوجات | Maintenance Core</span>
      </button>
    </nav>

    <div class="status-section" title="حالة الاتصال">
      <span id="netStatus" class="online-indicator"></span>
    </div>
  </header>

  <main class="viewport-container">
    <!-- 100% Pristine Moamen Fouad Work-Log2 Viewport -->
    <iframe
      id="frame-worklog"
      class="app-frame active"
      src="apps/worklog/index.html"
      allow="microphone; camera; clipboard-write; display-capture; speech-recognition"
      title="شغلي - Work Log (Servier)"
    ></iframe>

    <!-- 100% Pristine PRJ-30 Maintenance Core Viewport -->
    <iframe
      id="frame-maintenance"
      class="app-frame"
      src="apps/maintenance/index.html"
      allow="microphone; camera; clipboard-write; display-capture; speech-recognition"
      title="تشخيص الكتالوجات - Maintenance Core"
    ></iframe>
  </main>
</div>

<script>
  // Storage key
  const STORAGE_KEY = 'unified_portal_active_app';

  // Switch between Work-Log and Maintenance Core
  function switchApp(appName) {
    const isWorklog = (appName === 'worklog');
    
    // Switch tabs
    const tabWorklog = document.getElementById('tab-worklog');
    const tabMaint = document.getElementById('tab-maintenance');
    const frameWorklog = document.getElementById('frame-worklog');
    const frameMaint = document.getElementById('frame-maintenance');

    if (tabWorklog && tabMaint && frameWorklog && frameMaint) {
      if (isWorklog) {
        tabWorklog.classList.add('active');
        tabWorklog.setAttribute('aria-selected', 'true');
        tabMaint.classList.remove('active');
        tabMaint.setAttribute('aria-selected', 'false');

        frameWorklog.classList.add('active');
        frameMaint.classList.remove('active');

        document.title = '📋 شغلي | Work Log (Servier)';
      } else {
        tabMaint.classList.add('active');
        tabMaint.setAttribute('aria-selected', 'true');
        tabWorklog.classList.remove('active');
        tabWorklog.setAttribute('aria-selected', 'false');

        frameMaint.classList.add('active');
        frameWorklog.classList.remove('active');

        document.title = '⚙️ تشخيص الكتالوجات | Maintenance Core';
      }

      // Persist user selection
      try {
        localStorage.setItem(STORAGE_KEY, isWorklog ? 'worklog' : 'maintenance');
      } catch (err) {
        console.warn('Could not persist active app:', err);
      }
    }
  }

  // Restore active tab on load
  (function initPortal() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === 'maintenance') {
        switchApp('maintenance');
      } else {
        switchApp('worklog');
      }
    } catch (e) {
      switchApp('worklog');
    }

    // Network status monitoring
    function updateNet() {
      const el = document.getElementById('netStatus');
      if (el) {
        if (navigator.onLine) {
          el.classList.remove('offline');
          el.title = 'متصل بالإنترنت';
        } else {
          el.classList.add('offline');
          el.title = 'غير متصل (يعمل محلياً دون إنترنت)';
        }
      }
    }
    window.addEventListener('online', updateNet);
    window.addEventListener('offline', updateNet);
    updateNet();

    // Register root service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => {
          console.warn('Root SW registration skipped:', err);
        });
      });
    }
  })();
</script>
</body>
</html>
